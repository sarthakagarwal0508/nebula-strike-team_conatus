<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nebula Strike</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<main class="game">


    <!-- =====================================================
         START SCREEN
         ===================================================== -->

    <section
        id="start-screen"
        class="screen"
    >

        <div class="start-box">

            <p class="tag">
                DEEP SPACE COMBAT
            </p>

            <h1>
                NEBULA STRIKE
            </h1>

            <p>
                Survive the Nebula
            </p>


            <div class="controls">

                <span>
                    ← → / A D &nbsp; MOVE
                </span>

                <span>
                    SPACE &nbsp; SHOOT
                </span>

                <span>
                    E &nbsp; EMP
                </span>

            </div>


            <button id="start-btn">
                START GAME
            </button>

        </div>

    </section>



    <!-- =====================================================
         GAME SCREEN
         ===================================================== -->

    <section
        id="game-screen"
        class="screen"
    >


        <!-- =================================================
             TOP HUD
             ================================================= -->

        <div class="hud">


            <div class="hud-item">

                <span>
                    Score
                </span>

                <strong id="score">
                    0
                </strong>

            </div>


            <div class="hud-item">

                <span>
                    Wave
                </span>

                <strong id="wave">
                    1
                </strong>

            </div>


            <div class="hud-item">

                <span>
                    Lives
                </span>

                <strong id="lives">
                    3
                </strong>

            </div>


            <div class="hud-item">

                <span>
                    Combo
                </span>

                <strong id="combo">
                    x1
                </strong>

            </div>


            <!-- Added for enemy system -->

            <div class="hud-item">

                <span>
                    Enemies
                </span>

                <strong id="enemy-count">
                    0
                </strong>

            </div>


        </div>



        <!-- =================================================
             MISSION
             ================================================= -->

        <div class="mission">

            <span>

                MISSION:

                <strong id="mission-text">
                    Destroy 10 enemies
                </strong>

            </span>


            <span id="mission-progress">
                0 / 10
            </span>

        </div>



        <!-- =================================================
             BOSS HUD
             ================================================= -->

        <div
            id="boss-hud"
            class="boss-hud"
        >

            <div class="boss-title">
                BOSS
            </div>


            <div class="boss-bar">

                <div id="boss-fill"></div>

            </div>

        </div>



        <!-- =================================================
             GAME AREA
             ================================================= -->

        <div
            class="game-area"
            id="game-area"
        >


            <!-- PLAYER -->

            <div
                class="player"
                id="player"
            >
                🚀
            </div>


            <!-- EMP EFFECT -->

            <div
                class="emp-effect"
                id="emp-effect"
            ></div>


        </div>



        <!-- =================================================
             BOTTOM HUD
             ================================================= -->

        <div class="bottom-hud">


            <!-- ENERGY -->

            <div class="meter">

                <div class="meter-title">

                    <span>
                        Energy
                    </span>

                    <strong id="energy-value">
                        100%
                    </strong>

                </div>


                <div class="bar">

                    <div id="energy-fill"></div>

                </div>

            </div>



            <!-- EMP -->

            <div class="emp-status">

                <span>
                    EMP
                </span>

                <strong id="emp-status">
                    READY [E]
                </strong>

            </div>



            <!-- SHIELD -->

            <div class="meter">

                <div class="meter-title">

                    <span>
                        Shield
                    </span>

                    <strong id="shield-value">
                        100%
                    </strong>

                </div>


                <div class="bar shield-bar">

                    <div id="shield-fill"></div>

                </div>

            </div>


        </div>


    </section>



    <!-- =====================================================
         GAME OVER SCREEN
         ===================================================== -->

    <section
        id="game-over"
        class="screen"
    >

        <div class="end-box">

            <p class="tag">
                MISSION FAILED
            </p>


            <h2>
                GAME OVER
            </h2>


            <div class="final-stats">


                <p>

                    Score

                    <strong id="final-score">
                        0
                    </strong>

                </p>


                <p>

                    Wave

                    <strong id="final-wave">
                        1
                    </strong>

                </p>


            </div>


            <button id="restart-btn">
                PLAY AGAIN
            </button>

        </div>

    </section>


</main>



<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<!-- Teammate / player system -->
<script src="script.js"></script>

<!-- Ishan / enemy + progression system -->
<script src="enemy.js"></script>


</body>

</html>
